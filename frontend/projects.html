<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Projektek · HTR-ground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A backend {{ROOT_PATH}}-t behelyettesíti a runtime prefix-re. -->
  <base href="{{ROOT_PATH}}/">
  <meta name="root-path" content="{{ROOT_PATH}}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="projects.css">
</head>
<body>

<nav class="navbar navbar-dark-custom px-3">
  <a class="brand" href="{{ROOT_PATH}}/">HTR-ground</a>
  <span id="login-status" class="login-status"></span>
</nav>

<main>
  <div class="container">
    <div class="breadcrumb-row">
      <nav class="breadcrumb-wrap" id="breadcrumb" aria-label="Navigáció"></nav>
      <div class="header-actions">
        <div class="dropdown-wrap" id="new-menu-wrap" hidden>
          <button type="button" class="header-action-btn" id="new-menu-btn" title="Új mappa vagy fájl feltöltése">+ Új ↓</button>
          <div class="dropdown-menu" id="new-menu">
            <button type="button" data-new="folder">+ Új mappa…</button>
            <button type="button" data-new="files">⬆ Fájlok feltöltése…</button>
            <button type="button" data-new="dir">⬆ Mappa feltöltése…</button>
          </div>
        </div>
        <button type="button" class="header-action-btn" id="export-btn" title="Ez a mappa exportálása ZIP-be" hidden>Export ↓</button>
      </div>
    </div>

    <div class="stats-bar" id="stats-bar" hidden></div>

    <div id="content">
      <div class="state-msg">Betöltés…</div>
    </div>
  </div>
</main>

<!-- Export modal -->
<div class="export-modal-backdrop" id="export-backdrop" hidden>
  <div class="export-modal" role="dialog" aria-labelledby="export-title" aria-modal="true">
    <div class="export-header">
      <h2 id="export-title">Export ZIP-be</h2>
      <button type="button" class="export-close" id="export-close" aria-label="Bezárás">×</button>
    </div>

    <div class="export-body">
      <p class="export-target" id="export-target"></p>

      <p class="export-hint">Mit tartalmazzon a ZIP?</p>
      <div class="export-check-group">
        <label class="export-check export-check-all">
          <input type="checkbox" id="export-check-all">
          <span><strong>mind</strong></span>
        </label>

        <div class="export-check-sub">
          <label class="export-check">
            <input type="checkbox" data-format="alto-xml">
            <span>alto  <em>(ALTO XML annotáció)</em></span>
          </label>
          <label class="export-check">
            <input type="checkbox" data-format="page-xml">
            <span>page  <em>(PAGE XML annotáció)</em></span>
          </label>
          <label class="export-check">
            <input type="checkbox" data-format="json">
            <span>json  <em>(belső JSON annotáció)</em></span>
          </label>
          <label class="export-check">
            <input type="checkbox" data-format="pdf">
            <span>pdf   <em>(kereshető PDF)</em></span>
          </label>
          <label class="export-check">
            <input type="checkbox" data-extra="images">
            <span>kép   <em>(eredeti képfájlok)</em></span>
          </label>
          <label class="export-check">
            <input type="checkbox" data-extra="sidecars">
            <span>meta  <em>(státusz + audit sidecarok)</em></span>
          </label>
        </div>
      </div>

      <label class="export-check export-recursive">
        <input type="checkbox" id="export-recursive" checked>
        <span>Almappák is</span>
      </label>
    </div>

    <div class="export-footer">
      <button type="button" class="export-cancel" id="export-cancel">Mégse</button>
      <button type="button" class="export-submit" id="export-submit" disabled>Export ZIP</button>
    </div>
  </div>
</div>

<!-- Toast a warning-hoz -->
<div class="export-toast" id="export-toast" hidden></div>

<!-- Új mappa modal -->
<div class="export-modal-backdrop" id="newfolder-backdrop" hidden>
  <div class="export-modal" role="dialog" aria-labelledby="newfolder-title" aria-modal="true">
    <div class="export-header">
      <h2 id="newfolder-title">Új mappa</h2>
      <button type="button" class="export-close" data-close="newfolder">×</button>
    </div>
    <div class="export-body">
      <p class="export-target" id="newfolder-parent"></p>
      <label class="export-hint" for="newfolder-name">A létrehozandó mappa neve (almappa is lehet, „/"-cel)</label>
      <input type="text" id="newfolder-name" class="text-input" placeholder="pl. 1951 vagy alma/korte" autofocus>
    </div>
    <div class="export-footer">
      <button type="button" class="export-cancel" data-close="newfolder">Mégse</button>
      <button type="button" class="export-submit" id="newfolder-submit" disabled>Létrehozás</button>
    </div>
  </div>
</div>

<!-- Fájl upload modal (mindkét mód: fájlok / mappa) -->
<div class="export-modal-backdrop" id="upload-backdrop" hidden>
  <div class="export-modal" role="dialog" aria-labelledby="upload-title" aria-modal="true">
    <div class="export-header">
      <h2 id="upload-title">Fájlok feltöltése</h2>
      <button type="button" class="export-close" data-close="upload">×</button>
    </div>
    <div class="export-body">
      <p class="export-target" id="upload-target"></p>
      <p class="export-hint" id="upload-hint">Válaszd ki a fájlokat vagy a mappát a gombbal.</p>

      <input type="file" id="upload-files-input" multiple hidden
             accept=".jpg,.jpeg,.png,.tif,.tiff,.gif,.xml,.json">
      <input type="file" id="upload-dir-input" webkitdirectory multiple hidden>

      <button type="button" class="pick-btn" id="upload-pick-btn">Fájlok kiválasztása</button>

      <div class="upload-file-list" id="upload-file-list"></div>
      <p class="upload-summary" id="upload-summary"></p>
    </div>
    <div class="export-footer">
      <button type="button" class="export-cancel" data-close="upload">Mégse</button>
      <button type="button" class="export-submit" id="upload-submit" disabled>Feltöltés</button>
    </div>
  </div>
</div>

<!-- Törlés konfirmáció -->
<div class="export-modal-backdrop" id="delete-backdrop" hidden>
  <div class="export-modal" role="dialog" aria-labelledby="delete-title" aria-modal="true">
    <div class="export-header">
      <h2 id="delete-title">Törlés</h2>
      <button type="button" class="export-close" data-close="delete">×</button>
    </div>
    <div class="export-body">
      <p class="delete-message" id="delete-message"></p>
      <p class="delete-details" id="delete-details"></p>
      <p class="delete-warn">Ez a művelet nem visszavonható.</p>
    </div>
    <div class="export-footer">
      <button type="button" class="export-cancel" data-close="delete">Mégse</button>
      <button type="button" class="delete-submit" id="delete-submit">Törlés</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  © 2026 Szekrényes István
  <span class="sep">·</span>
  <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GNU GPL v3</a>
  <span class="sep">·</span>
  <a href="https://github.com/szekrenyesi/HTR-ground" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="projects.js"></script>
</body>
</html>
