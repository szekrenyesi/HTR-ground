<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Belépés · HTR-ground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #13141a;
      color: #d8d8e0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .navbar-dark-custom {
      background: #1c1d26; border-bottom: 1px solid #2a2b3a;
    }
    .brand {
      font-weight: 600; color: #d8d8e0; letter-spacing: 0.5px;
      text-decoration: none;
    }
    .brand:hover { color: #f0d060; }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 30px 15px;
    }
    .login-card {
      background: #1c1d26; border: 1px solid #2a2b3a; border-radius: 10px;
      padding: 32px 28px; width: 100%; max-width: 380px;
    }
    .login-card h1 {
      font-size: 20px; font-weight: 600; margin: 0 0 6px; color: #d8d8e0;
    }
    .login-card .hint {
      font-size: 12px; color: #888; margin-bottom: 20px;
    }
    label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .form-control {
      background: #25263a; border: 1px solid #35364a; color: #d8d8e0;
    }
    .form-control:focus {
      background: #2e304a; border-color: #4a4c6a;
      box-shadow: 0 0 0 0.2rem rgba(80,180,255,0.15);
      color: #d8d8e0;
    }
    .btn-primary-custom {
      background: #2a5a3a; border: none; color: #7dcc9a; font-weight: 600;
      padding: 8px 20px;
    }
    .btn-primary-custom:hover { background: #336a46; color: #a5d9ba; }
    .error-msg {
      background: rgba(232, 100, 100, 0.12);
      border: 1px solid rgba(232, 100, 100, 0.3);
      color: #e88484;
      padding: 8px 12px; border-radius: 5px; font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark-custom px-3">
  <a class="brand" href="/">HTR-ground</a>
</nav>

<main>
  <div class="login-card">
    <h1>Belépés</h1>
    <p class="hint">Felhasználónév és jelszó a projektek eléréséhez.</p>

    <div id="error-box" class="error-msg" style="display:none">
      Hibás felhasználónév vagy jelszó. Próbáld újra.
    </div>

    <form method="POST" action="/login">
      <input type="hidden" name="next" id="next-input" value="">
      <div class="mb-3">
        <label for="username">Felhasználónév</label>
        <input type="text" name="username" id="username" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password">Jelszó</label>
        <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <a href="/" class="btn-link-plain" style="color:#888; text-decoration:none; font-size:12px;">← Vissza</a>
        <button type="submit" class="btn btn-primary-custom">Belépés</button>
      </div>
    </form>
  </div>
</main>

<script>
// URL query paraméterek olvasása: error / next
const params = new URLSearchParams(window.location.search);
if (params.get('error') === '1') {
  document.getElementById('error-box').style.display = 'block';
}
const nextParam = params.get('next');
if (nextParam) {
  document.getElementById('next-input').value = nextParam;
}
</script>

</body>
</html>
