<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Belépés · HTR-ground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A backend {{ROOT_PATH}}-t behelyettesíti a runtime prefix-re. -->
  <base href="{{ROOT_PATH}}/">
  <meta name="root-path" content="{{ROOT_PATH}}">
  <meta name="default-theme" content="{{DEFAULT_THEME}}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .navbar-dark-custom {
      background: var(--bg-nav); border-bottom: 1px solid var(--border-subtle);
    }
    .brand {
      font-weight: 600; color: var(--text-primary); letter-spacing: 0.5px;
      text-decoration: none;
    }
    .brand:hover { color: var(--accent-brand-hover); }
    .nav-right {
      display: inline-flex; align-items: center; gap: 10px;
    }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 30px 15px;
    }
    .login-card {
      background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 10px;
      padding: 32px 28px; width: 100%; max-width: 380px;
    }
    .login-card h1 {
      font-size: 20px; font-weight: 600; margin: 0 0 6px; color: var(--text-primary);
    }
    .login-card .hint {
      font-size: 12px; color: var(--text-muted); margin-bottom: 20px;
    }
    label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-control {
      background: var(--bg-input); border: 1px solid var(--border-medium); color: var(--text-primary);
    }
    .form-control:focus {
      background: var(--bg-hover); border-color: var(--border-strong);
      box-shadow: 0 0 0 0.2rem rgba(80,180,255,0.15);
      color: var(--text-primary);
    }
    .btn-primary-custom {
      background: var(--accent-success-bg); border: none; color: var(--accent-success); font-weight: 600;
      padding: 8px 20px;
    }
    .btn-primary-custom:hover { background: var(--accent-success-bg-hover); color: var(--accent-success-hover); }
    .error-msg {
      background: var(--accent-error-bg);
      border: 1px solid var(--accent-error-border);
      color: var(--accent-error);
      padding: 8px 12px; border-radius: 5px; font-size: 13px;
      margin-bottom: 16px;
    }

    /* Lábléc */
    .site-footer {
      flex-shrink: 0;
      padding: 14px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-panel-alt);
      font-size: 11px; color: var(--text-dim);
      text-align: center;
    }
    .site-footer a { color: var(--accent-success); text-decoration: none; }
    .site-footer a:hover { color: var(--accent-success-hover); }
    .site-footer .sep { color: var(--text-ultra-faint); margin: 0 8px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark-custom px-3">
  <a class="brand" href="{{ROOT_PATH}}/">HTR-ground</a>
  <span class="nav-right">
    <button type="button" class="theme-toggle" id="theme-toggle">Világos</button>
  </span>
</nav>

<main>
  <div class="login-card">
    <h1>Belépés</h1>
    <p class="hint">Felhasználónév és jelszó a projektek eléréséhez.</p>

    <div id="error-box" class="error-msg" style="display:none">
      Hibás felhasználónév vagy jelszó. Próbáld újra.
    </div>

    <form method="POST" action="{{ROOT_PATH}}/login">
      <input type="hidden" name="next" id="next-input" value="">
      <div class="mb-3">
        <label for="username">Felhasználónév</label>
        <input type="text" name="username" id="username" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password">Jelszó</label>
        <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <a href="{{ROOT_PATH}}/" class="btn-link-plain" style="color:#888; text-decoration:none; font-size:12px;">← Vissza</a>
        <button type="submit" class="btn btn-primary-custom">Belépés</button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
  © 2026 Szekrényes István
  <span class="sep">·</span>
  <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GNU GPL v3</a>
  <span class="sep">·</span>
  <a href="https://github.com/szekrenyesi/HTR-ground" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
// URL query paraméterek olvasása: error / next
const params = new URLSearchParams(window.location.search);
if (params.get('error') === '1') {
  document.getElementById('error-box').style.display = 'block';
}
const nextParam = params.get('next');
if (nextParam) {
  document.getElementById('next-input').value = nextParam;
}
</script>

</body>
</html>
