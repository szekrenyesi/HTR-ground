<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>HTR Editor</title>
  <!-- A base tag ELSŐKÉNT — hogy a browser preload scanner-e is a HELYES
       URL-t használja a CSS/JS betöltéséhez. A backend behelyettesíti a
       {{ROOT_PATH}} placeholder-t (üres = root deployment, pl. "/htr-ground"
       ha sub-path alatt fut). file:// módban a placeholder marad; egy alábbi
       inline script akkor cseréli ki a fájl-relatív URL-re. -->
  <base href="{{ROOT_PATH}}/">
  <script>
    (function() {
      // file:// mód: ha a placeholder literálisan maradt, cseréljük a base-t
      // a jelenlegi fájl mappájára. (A CSS/JS előbetöltés így már rossz URL-t
      // próbált — nyugodtan retry a link/script elemek újra-hozzáadásával.)
      var b = document.querySelector('base');
      if (!b) return;
      if (b.href.indexOf('%7B%7BROOT_PATH%7D%7D') === -1
          && b.href.indexOf('{'+'{ROOT_PATH}}') === -1) return;
      // A placeholder itt maradt → file:// mód
      b.href = location.href.replace(/[^/]*(\?.*)?$/, '');
    })();
  </script>
  <meta name="root-path" content="{{ROOT_PATH}}">
  <meta name="default-theme" content="{{DEFAULT_THEME}}">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="editor.css">
  <script src="theme.js"></script>
</head>
<body>

<div id="toolbar">
  <button class="back-btn" id="back-btn" title="Vissza" style="display:none">←</button>

  <label class="file-btn" id="json-label" for="json-input">HTR betöltése (JSON / XML)</label>
  <input type="file" id="json-input" accept=".json,.xml,.alto,.page">

  <label class="file-btn" id="img-label" for="img-input">Kép betöltése</label>
  <input type="file" id="img-input" accept="image/*">

  <div class="sep"></div>

  <div id="zoom-controls">
    <button class="zoom-btn" id="zoom-out" title="Kicsinyítés (-)">−</button>
    <span id="zoom-label" title="Illesztés visszaállítása">Illesztés</span>
    <button class="zoom-btn" id="zoom-in" title="Nagyítás (+)">+</button>
  </div>

  <div class="sep"></div>

  <div id="img-controls" style="display:flex; gap:3px; align-items:center;">
    <button class="img-filter-btn" id="contrast-btn" title="Kontraszt léptetése">Kont.</button>
    <button class="img-filter-btn active" id="outline-btn" title="Sor kiemelése a kontextushoz képest (részletnézet)">Kiemelés</button>
  </div>

  <div class="sep"></div>

  <div id="save-wrap">
    <button id="save-btn" disabled>Mentés<span class="caret" id="save-caret">▾</span></button>
    <button id="export-btn" style="display:none">Export<span class="caret">▾</span></button>
    <div id="save-menu">
      <div class="menu-hint" id="save-menu-hint">Formátum</div>
      <button data-format="json">JSON (belső)</button>
      <button data-format="alto-xml">ALTO XML</button>
      <button data-format="page-xml">PAGE XML</button>
      <button data-format="pdf">PDF (kereshető)</button>
    </div>
  </div>
  <div id="project-info" style="display:none"></div>
  <div id="status">Nincs betöltve fájl</div>
  <button type="button" class="theme-toggle" id="theme-toggle">Világos</button>
</div>

<div id="main">
  <div id="image-panel-wrap">
    <div id="image-panel">
      <div id="no-image-hint">Tölts be egy képet a megjelenítéshez</div>
      <div id="image-container" style="display:none">
        <img id="page-image" alt="oldal kép">
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <canvas id="detail-canvas"></canvas>
    <span id="detail-meta"></span>
    <div id="detail-empty">Válassz egy sort a részletes nézethez</div>
    <div id="view-toggle-wrap">
      <button class="view-toggle-btn" id="view-toggle-btn" title="Váltás oldal/részlet nézet között">Részlet nézet</button>
    </div>
  </div>

  <div id="text-panel">
    <div id="empty-state">
      <div class="big">📜</div>
      <div class="title">HTR kimenet javítása</div>
      <div class="hint">Tölts be egy JSON fájlt (és opcionálisan a hozzá tartozó képet) a szerkesztés megkezdéséhez.</div>
    </div>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
